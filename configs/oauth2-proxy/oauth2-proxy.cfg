# Base oauth2-proxy configuration used by docker-compose.yml.
# Provider selection and secrets come from environment variables so the same
# file can be used for generic OIDC, Keycloak, or Google Workspace.

http_address = "0.0.0.0:4180"
upstreams = ["static://202"]

set_xauthrequest = true
reverse_proxy = true
proxy_websockets = true
skip_provider_button = true
scope = "openid profile email"

cookie_name = "__Host-octw_oauth2"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_refresh = "1h"
cookie_expire = "8h"

pass_access_token = false
pass_authorization_header = false
set_authorization_header = false
skip_auth_strip_headers = true

session_store_type = "redis"
redis_connection_url = "redis://octw-cache:6379/1"

standard_logging = true
request_logging = true
auth_logging = true
silence_ping_logging = true
