# Google Workspace example for oauth2-proxy.
# Copy the relevant settings into oauth2-proxy.cfg or keep this file as a
# reference while setting OCTW_OIDC_PROVIDER=google.

provider = "google"
email_domains = ["example.com"]
whitelist_domains = [".example.com"]

# Optional: require membership in one or more Google Groups.
# This requires Admin SDK access. Mount the service account JSON at:
#   configs/oauth2-proxy/credentials/google-admin-sdk.json
# inside the container as /var/run/oauth2-proxy/google-admin-sdk.json.
# google_admin_email = "admin@example.com"
# google_groups = ["octw-users@example.com"]
# google_service_account_json = "/var/run/oauth2-proxy/google-admin-sdk.json"

# Optional: if you run on GCP with Workload Identity instead of a JSON key.
# google_use_application_default_credentials = true
# google_target_principal = "oauth2-proxy@example-project.iam.gserviceaccount.com"
# google_use_organization_id = true
