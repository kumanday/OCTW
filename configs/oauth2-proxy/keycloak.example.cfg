# Keycloak example for oauth2-proxy.
# Copy the relevant settings into oauth2-proxy.cfg or keep this file as a
# reference while setting OCTW_OIDC_PROVIDER=keycloak-oidc.

provider = "keycloak-oidc"
oidc_issuer_url = "https://keycloak.example.com/realms/octw"
scope = "openid profile email roles groups"
email_domains = ["example.com"]
whitelist_domains = [".example.com"]

# Optional: require realm or client roles presented by Keycloak.
# allowed_roles = ["octw-user"]

# Optional: require membership in explicit Keycloak groups.
# keycloak_groups = ["/octw-users"]

# Optional: trust a private CA when Keycloak uses an internal certificate.
# provider_ca_files = ["/var/run/oauth2-proxy/keycloak-ca.pem"]
